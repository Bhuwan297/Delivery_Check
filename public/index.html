<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<title>Delivery Check</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    --bg: #0b0d10;
    --surface: #15181d;
    --surface-2: #1c2028;
    --border: #2a2f38;
    --text: #eef1f5;
    --text-dim: #8b93a1;
    --accent: #ffb020;
    --accent-dim: #a5731a;
    --ok: #2ecc71;
    --danger: #ff5c5c;
    --drinks: #3aa0ff;
    --snacks: #ff9f43;
    --frozen: #5ad1e6;
    --tobacco: #b98cff;
    --grocery: #9ad86a;
    --dairy: #ffd166;
    --household: #ff7bb0;
    --other: #8b93a1;
    font-size: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    padding: 18px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; cursor: pointer;
  }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  /* --- Scan screen --- */
  .scan-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px 20px; text-align: center;
  }
  .scan-card p { color: var(--text-dim); margin: 8px 0 20px; font-size: 0.92rem; line-height: 1.4; }
  .big-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--accent); color: #1a1200; font-weight: 700; font-size: 1.05rem;
    border: none; border-radius: 14px; padding: 16px 22px; width: 100%;
    cursor: pointer; letter-spacing: 0.01em;
  }
  .big-btn:active { transform: scale(0.98); }
  .big-btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .big-btn:disabled { opacity: 0.4; }

  .page-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .page-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  }
  .page-thumb {
    width: 52px; height: 52px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .page-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .page-info { flex: 1; min-width: 0; }
  .page-title { font-size: 0.9rem; font-weight: 600; }
  .page-status { font-size: 0.8rem; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .page-status.scanning { color: var(--accent); }
  .page-status.done { color: var(--ok); }
  .page-status.partial { color: var(--accent); }
  .page-status.error { color: var(--danger); }
  .mini-spinner {
    width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  .page-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .page-actions button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; width: 32px; height: 32px; font-size: 0.85rem; cursor: pointer;
  }

  /* --- Checklist screen --- */
  .info-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .info-card summary {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);
    cursor: pointer; list-style: none;
  }
  .info-card summary::-webkit-details-marker { display: none; }
  .info-card summary .chev { transition: transform 0.15s ease; color: var(--text-dim); }
  .info-card[open] summary .chev { transform: rotate(180deg); }
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;
  }
  .info-tile {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
  }
  .info-tile .info-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 2px;
  }
  .info-tile .info-value {
    font-size: 0.95rem; font-weight: 700; font-family: ui-monospace, Menlo, monospace; word-break: break-word;
  }

  .progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-top .count { font-family: ui-monospace, Menlo, monospace; font-size: 1.4rem; font-weight: 700; }
  .progress-top .label { color: var(--text-dim); font-size: 0.85rem; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--ok); transition: width 0.2s ease; }

  .category { margin-top: 4px; }
  .category-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 4px 6px;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .item-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; user-select: none;
  }
  .item-row.checked { opacity: 0.45; }
  .item-row.checked .item-name { text-decoration: line-through; }
  .checkbox {
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 0.95rem; font-weight: 700;
  }
  .item-row.checked .checkbox { background: var(--ok); border-color: var(--ok); color: #06210f; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 1rem; font-weight: 600; }
  .item-meta { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; }
  .item-qty { font-family: ui-monospace, Menlo, monospace; font-size: 1.15rem; font-weight: 700; color: var(--accent); min-width: 34px; text-align: right; }

  .fab-row { display: flex; gap: 10px; margin-top: 4px; }
  .fab-row .big-btn { flex: 1; }

  .missing-panel {
    background: var(--surface); border: 1px solid var(--danger); border-radius: 14px; padding: 16px;
  }
  .missing-panel h3 { margin: 0 0 10px; color: var(--danger); font-size: 0.95rem; }
  .missing-panel ul { margin: 0; padding-left: 18px; font-size: 0.9rem; line-height: 1.6; }
  .missing-panel .copy-row { display: flex; gap: 8px; margin-top: 12px; }

  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 0.9rem; }

  .loading { text-align: center; padding: 60px 20px; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--text-dim); font-size: 0.9rem; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  input[type="file"] { display: none; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end;
    z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 0 0;
    padding: 20px; width: 100%; max-width: 560px; margin: 0 auto;
  }
  .modal h3 { margin: 0 0 14px; }
  .modal label { display: block; font-size: 0.8rem; color: var(--text-dim); margin: 12px 0 6px; }
  .modal input, .modal select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px; font-size: 1rem;
  }
  .modal .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal .modal-actions .big-btn { flex: 1; padding: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Delivery<span>Check</span></h1>
    <button class="icon-btn" id="newDeliveryBtn" title="Start new delivery">↻</button>
  </header>

  <main id="main"></main>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" />
<input type="file" id="uploadInput" accept="image/*" multiple />
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script>
(() => {
  const STORAGE_KEY = "deliverycheck_current_v1";
  const MAX_DIM = 2000; // higher res so dense small-print tables stay legible
  const JPEG_QUALITY = 0.92;

  const CATEGORY_COLORS = {
    "Drinks": "var(--drinks)",
    "Snacks": "var(--snacks)",
    "Frozen": "var(--frozen)",
    "Tobacco": "var(--tobacco)",
    "Grocery & Pantry": "var(--grocery)",
    "Dairy & Bakery": "var(--dairy)",
    "Household & Health": "var(--household)",
    "Other": "var(--other)",
  };

  let state = loadState() || { screen: "scan", photos: [], items: [], deliveryInfo: [] };

  const main = document.getElementById("main");
  const cameraInput = document.getElementById("cameraInput");
  const uploadInput = document.getElementById("uploadInput");
  const toastEl = document.getElementById("toast");

  document.getElementById("newDeliveryBtn").addEventListener("click", () => {
    if (state.items.length && !confirm("Start a new delivery? This clears the current checklist.")) return;
    state = { screen: "scan", photos: [], items: [], deliveryInfo: [] };
    persist();
    render();
  });

  // Photos are scanned one at a time, right after they're added — not queued up
  // into one big batch — so each page's result (and any failure) shows up
  // immediately instead of only being discoverable after everything finishes.
  async function addAndScanPhotos(files) {
    const newPhotos = [];
    for (const file of files) {
      try {
        const dataUrl = await processImageFile(file);
        const photo = { id: crypto.randomUUID(), dataUrl, status: "pending", items: [], deliveryInfo: [], error: null };
        state.photos.push(photo);
        newPhotos.push(photo);
      } catch (err) {
        console.error(err);
        showToast("Couldn't read one of the photos — try again");
      }
    }
    persist();
    render();
    for (const photo of newPhotos) {
      await scanSinglePhoto(photo.id);
    }
  }

  cameraInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files || []);
    cameraInput.value = "";
    addAndScanPhotos(files);
  });

  uploadInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files || []);
    uploadInput.value = "";
    addAndScanPhotos(files);
  });

  async function processImageFile(file) {
    let workingBlob = file;
    const isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "");
    if (isHeic) {
      workingBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
      if (Array.isArray(workingBlob)) workingBlob = workingBlob[0];
    }
    const bitmap = await createImageBitmap(workingBlob);
    const scale = Math.min(1, MAX_DIM / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * scale);
    const h = Math.round(bitmap.height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, w, h);
    return canvas.toDataURL("image/jpeg", JPEG_QUALITY);
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  // Splits one page photo into two overlapping vertical halves so a single
  // dense page never has to be read in one request — each half is faster for
  // Claude to work through (keeping every request safely under Netlify's fixed
  // function timeout) and the overlap band means a row sitting right at the
  // midpoint still appears fully in at least one half.
  function sliceBitmap(bitmap, w, yStart, yEnd) {
    const sliceH = Math.round(yEnd - yStart);
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = sliceH;
    canvas.getContext("2d").drawImage(bitmap, 0, yStart, w, sliceH, 0, 0, w, sliceH);
    return canvas.toDataURL("image/jpeg", JPEG_QUALITY);
  }

  async function cropIntoParts(dataUrl) {
    const blob = await (await fetch(dataUrl)).blob();
    const bitmap = await createImageBitmap(blob);
    const w = bitmap.width;
    const h = bitmap.height;
    const overlap = h * 0.15;
    return [
      sliceBitmap(bitmap, w, 0, h / 2 + overlap),
      sliceBitmap(bitmap, w, Math.max(0, h / 2 - overlap), h),
    ];
  }

  // Merges the extraction results from a page's parts, dropping exact
  // name+quantity duplicates that show up in both halves' overlap band.
  function mergeParts(partResults) {
    const seen = new Set();
    const items = [];
    let deliveryInfo = [];
    partResults.forEach((r) => {
      if (!deliveryInfo.length && r.deliveryInfo && r.deliveryInfo.length) deliveryInfo = r.deliveryInfo;
      r.items.forEach((it) => {
        const key = (it.name || "").trim().toLowerCase() + "|" + it.quantity;
        if (seen.has(key)) return;
        seen.add(key);
        items.push(it);
      });
    });
    return { items, deliveryInfo };
  }

  const MAX_ATTEMPTS = 3; // 1 initial try + 2 retries
  const RETRY_DELAYS_MS = [2000, 5000]; // backoff before retry 1 and retry 2 — long enough to clear a per-minute rate limit

  async function fetchBatch(images, attempt = 1) {
    try {
      const res = await fetch("/.netlify/functions/parse-invoice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ images }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return { items: data.items || [], deliveryInfo: data.deliveryInfo || [] };
    } catch (err) {
      if (attempt < MAX_ATTEMPTS) {
        await sleep(RETRY_DELAYS_MS[attempt - 1]);
        return fetchBatch(images, attempt + 1);
      }
      throw err;
    }
  }

  async function scanSinglePhoto(photoId) {
    const photo = state.photos.find((p) => p.id === photoId);
    if (!photo) return;
    photo.status = "scanning";
    photo.error = null;
    persist();
    render();
    try {
      const parts = await cropIntoParts(photo.dataUrl);
      const results = await Promise.allSettled(
        parts.map((dataUrl) => fetchBatch([dataUrl.split(",")[1]]))
      );
      const succeeded = results.filter((r) => r.status === "fulfilled").map((r) => r.value);
      if (succeeded.length === 0) {
        const firstFailure = results.find((r) => r.status === "rejected");
        photo.status = "error";
        photo.error = (firstFailure && firstFailure.reason && firstFailure.reason.message) || "Scan failed";
      } else {
        const merged = mergeParts(succeeded);
        photo.items = merged.items;
        photo.deliveryInfo = merged.deliveryInfo;
        photo.status = succeeded.length === parts.length ? "done" : "partial";
      }
    } catch (err) {
      console.error(err);
      photo.status = "error";
      photo.error = err.message || "Scan failed";
    }
    persist();
    render();
  }

  function proceedToChecklist() {
    const items = [];
    let deliveryInfo = [];
    state.photos.forEach((p) => {
      if (p.status === "done" || p.status === "partial") {
        items.push(...p.items);
        if (!deliveryInfo.length && p.deliveryInfo && p.deliveryInfo.length) deliveryInfo = p.deliveryInfo;
      }
    });
    if (items.length === 0) {
      showToast("No pages finished scanning yet");
      return;
    }
    state.items = items.map((it) => ({
      id: crypto.randomUUID(),
      name: it.name,
      quantity: it.quantity,
      unit: it.unit || "",
      category: CATEGORY_COLORS[it.category] ? it.category : "Other",
      checked: false,
    }));
    state.deliveryInfo = deliveryInfo;
    state.screen = "checklist";
    persist();
    render();
  }

  function toggleItem(id) {
    const item = state.items.find((i) => i.id === id);
    if (!item) return;
    item.checked = !item.checked;
    persist();
    renderChecklistOnly();
  }

  function removePhoto(id) {
    state.photos = state.photos.filter((p) => p.id !== id);
    persist();
    render();
  }

  function addManualItem() {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal">
        <h3>Add item</h3>
        <label>Product name</label>
        <input type="text" id="mName" placeholder="e.g. Red Bull 12pk" />
        <label>Quantity</label>
        <input type="number" id="mQty" value="1" min="1" />
        <label>Category</label>
        <select id="mCat">
          ${Object.keys(CATEGORY_COLORS).map((c) => `<option value="${c}">${c}</option>`).join("")}
        </select>
        <div class="modal-actions">
          <button class="big-btn secondary" id="mCancel">Cancel</button>
          <button class="big-btn" id="mAdd">Add</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#mCancel").addEventListener("click", () => overlay.remove());
    overlay.querySelector("#mAdd").addEventListener("click", () => {
      const name = overlay.querySelector("#mName").value.trim();
      const qty = parseInt(overlay.querySelector("#mQty").value, 10) || 1;
      const category = overlay.querySelector("#mCat").value;
      if (!name) return;
      state.items.push({ id: crypto.randomUUID(), name, quantity: qty, unit: "", category, checked: false });
      persist();
      overlay.remove();
      renderChecklistOnly();
    });
  }

  function copyMissingReport() {
    const missing = state.items.filter((i) => !i.checked);
    const text = missing.length
      ? "Missing / short from delivery:\n" + missing.map((i) => `- ${i.name} (x${i.quantity}${i.unit ? " " + i.unit : ""})`).join("\n")
      : "Everything checked off — no shortages.";
    navigator.clipboard.writeText(text).then(
      () => showToast("Copied to clipboard"),
      () => showToast("Couldn't copy — select and copy manually")
    );
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }
  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
  }

  function render() {
    if (state.screen === "checklist") return renderChecklist();
    return renderScan();
  }

  function renderScan() {
    const anyInProgress = state.photos.some((p) => p.status === "scanning" || p.status === "pending");
    const doneCount = state.photos.filter((p) => p.status === "done" || p.status === "partial").length;
    const doneItemCount = state.photos.reduce((sum, p) => sum + ((p.status === "done" || p.status === "partial") ? p.items.length : 0), 0);

    main.innerHTML = `
      <div class="scan-card">
        <p>Add one page at a time — each photo gets read as soon as you add it, so you can check it before moving to the next.</p>
        <div class="fab-row">
          <button class="big-btn" id="takePhotoBtn" ${anyInProgress ? "disabled" : ""}>📷 Take photo</button>
          <button class="big-btn secondary" id="uploadBtn" ${anyInProgress ? "disabled" : ""}>🖼️ Upload photos</button>
        </div>
      </div>
      ${state.photos.length ? `<div class="page-list" id="pageList"></div>` : ""}
      ${doneCount ? `
        <button class="big-btn secondary" id="viewChecklistBtn">✓ View checklist (${doneItemCount} item${doneItemCount === 1 ? "" : "s"} so far)</button>
      ` : ""}
    `;
    document.getElementById("takePhotoBtn").addEventListener("click", () => cameraInput.click());
    document.getElementById("uploadBtn").addEventListener("click", () => uploadInput.click());

    const list = document.getElementById("pageList");
    if (list) {
      state.photos.forEach((p, idx) => {
        const row = document.createElement("div");
        row.className = "page-row";
        let statusHtml = "";
        if (p.status === "scanning" || p.status === "pending") {
          statusHtml = `<div class="page-status scanning"><span class="mini-spinner"></span> Reading…</div>`;
        } else if (p.status === "done") {
          statusHtml = `<div class="page-status done">✓ ${p.items.length} item${p.items.length === 1 ? "" : "s"} found</div>`;
        } else if (p.status === "partial") {
          statusHtml = `<div class="page-status partial">⚠ ${p.items.length} item${p.items.length === 1 ? "" : "s"} found — part of this page failed, tap ↻ to retry</div>`;
        } else if (p.status === "error") {
          statusHtml = `<div class="page-status error">⚠ ${escapeHtml(p.error || "Failed")}</div>`;
        }
        row.innerHTML = `
          <div class="page-thumb"><img src="${p.dataUrl}" /></div>
          <div class="page-info">
            <div class="page-title">Page ${idx + 1}</div>
            ${statusHtml}
          </div>
          <div class="page-actions">
            <button class="rescanBtn" title="Rescan this page">↻</button>
            <button class="rmBtn" title="Remove">✕</button>
          </div>
        `;
        row.querySelector(".rescanBtn").addEventListener("click", () => scanSinglePhoto(p.id));
        row.querySelector(".rmBtn").addEventListener("click", () => removePhoto(p.id));
        list.appendChild(row);
      });
    }

    const viewBtn = document.getElementById("viewChecklistBtn");
    if (viewBtn) viewBtn.addEventListener("click", proceedToChecklist);
  }

  function renderChecklist() {
    main.innerHTML = `<div id="checklistContent"></div>`;
    renderChecklistOnly();
  }

  function renderChecklistOnly() {
    const wrap = document.getElementById("checklistContent") || main;
    if (!state.items.length) {
      wrap.innerHTML = `<div class="empty-state">No items — go back and rescan, or add items manually.</div>
        <button class="big-btn secondary" id="addManualBtn2" style="margin-top:12px;">+ Add item</button>`;
      wrap.querySelector("#addManualBtn2").addEventListener("click", addManualItem);
      return;
    }

    const total = state.items.length;
    const checkedCount = state.items.filter((i) => i.checked).length;
    const pct = Math.round((checkedCount / total) * 100);
    const missing = state.items.filter((i) => !i.checked);

    const byCategory = {};
    state.items.forEach((it) => {
      (byCategory[it.category] = byCategory[it.category] || []).push(it);
    });

    let html = "";

    if (state.deliveryInfo && state.deliveryInfo.length) {
      html += `
        <details class="info-card" open>
          <summary>Delivery info <span class="chev">▾</span></summary>
          <div class="info-grid">
            ${state.deliveryInfo.map((f) => `
              <div class="info-tile">
                <div class="info-label">${escapeHtml(f.label)}</div>
                <div class="info-value">${escapeHtml(f.value)}</div>
              </div>
            `).join("")}
          </div>
        </details>
      `;
    }

    html += `
      <div class="progress-wrap">
        <div class="progress-top">
          <span class="count">${checkedCount} / ${total}</span>
          <span class="label">counted</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;

    Object.keys(byCategory).forEach((cat) => {
      const color = CATEGORY_COLORS[cat] || "var(--other)";
      html += `<div class="category">
        <div class="category-head"><span class="dot" style="background:${color}"></span>${cat}</div>`;
      byCategory[cat].forEach((it) => {
        html += `
          <div class="item-row ${it.checked ? "checked" : ""}" data-id="${it.id}">
            <div class="checkbox">${it.checked ? "✓" : ""}</div>
            <div class="item-info">
              <div class="item-name">${escapeHtml(it.name)}</div>
              ${it.unit ? `<div class="item-meta">${escapeHtml(it.unit)}</div>` : ""}
            </div>
            <div class="item-qty">×${it.quantity}</div>
          </div>`;
      });
      html += `</div>`;
    });

    html += `
      <div class="fab-row">
        <button class="big-btn secondary" id="addManualBtn">+ Add item</button>
        <button class="big-btn secondary" id="rescanBtn">📷 Add photos</button>
      </div>
    `;

    if (missing.length) {
      html += `
        <div class="missing-panel">
          <h3>⚠ Missing report — ${missing.length} item${missing.length === 1 ? "" : "s"} not yet counted</h3>
          <ul>${missing.map((i) => `<li>${escapeHtml(i.name)} (×${i.quantity})</li>`).join("")}</ul>
          <div class="copy-row">
            <button class="big-btn secondary" id="copyMissingBtn">📋 Copy report</button>
          </div>
        </div>`;
    }

    wrap.innerHTML = html;
    wrap.querySelectorAll(".item-row").forEach((row) => {
      row.addEventListener("click", () => toggleItem(row.dataset.id));
    });
    const addBtn = wrap.querySelector("#addManualBtn");
    if (addBtn) addBtn.addEventListener("click", addManualItem);
    const rescanBtn = wrap.querySelector("#rescanBtn");
    if (rescanBtn) rescanBtn.addEventListener("click", () => { state.screen = "scan"; state.photos = []; persist(); render(); });
    const copyBtn = wrap.querySelector("#copyMissingBtn");
    if (copyBtn) copyBtn.addEventListener("click", copyMissingReport);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  render();
})();
</script>
</body>
</html>
